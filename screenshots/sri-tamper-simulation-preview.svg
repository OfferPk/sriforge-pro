  <text x="165" y="38" fill="#06b6d4" font-size="14" font-weight="600">— CDN Tamper &amp; Supply Chain Attack Simulator</text>

  <!-- Left Form -->
  <g transform="translate(32, 90)" filter="url(#shadow2)">
