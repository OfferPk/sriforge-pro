    <text x="24" y="75" fill="#94a3b8" font-size="12" font-weight="600">AUTHENTIC ASSET CODE</text>
    <rect x="24" y="85" width="502" height="70" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="110" fill="#f1f5f9" font-size="12" font-family="monospace">function initStripe() {</text>
