    <text x="36" y="340" fill="#f43f5e" font-size="11" font-family="monospace">The resource has been blocked.</text>
    <text x="36" y="375" fill="#94a3b8" font-size="11" font-family="monospace">[Security] Subresource Integrity verification failed.</text>
    <text x="36" y="395" fill="#94a3b8" font-size="11" font-family="monospace">Execution aborted prior to script evaluation.</text>
