<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#0a0d14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101622"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Top Navbar -->
  <rect width="1200" height="64" fill="#101622" stroke="#233047" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="32" y="16" width="32" height="32" rx="6" fill="url(#accentGrad)"/>
  <path d="M48 22 L40 26 v6 c0 4 3 8 8 9 5-1 8-5 8-9 v-6 z" fill="#ffffff" opacity="0.9"/>
  <text x="76" y="38" fill="#ffffff" font-size="18" font-weight="700">SRIForge Pro</text>
  <rect x="196" y="24" width="86" height="18" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <text x="204" y="37" fill="#06b6d4" font-size="11" font-weight="700">W3C SRI Level 2</text>

  <!-- Action Buttons -->
  <rect x="800" y="18" width="200" height="30" rx="6" fill="#172133" stroke="#233047" stroke-width="1"/>
  <text x="814" y="38" fill="#f1f5f9" font-size="12">Preset: PCI DSS 4.0 Checkout</text>
  <rect x="1012" y="18" width="156" height="30" rx="6" fill="#06b6d4"/>
  <text x="1034" y="38" fill="#04121d" font-size="12" font-weight="700">Auto-Harden HTML</text>

  <!-- Tab Bar -->
  <rect y="64" width="1200" height="42" fill="#0d121c" stroke="#233047" stroke-width="1"/>
  <text x="48" y="90" fill="#06b6d4" font-size="13" font-weight="700">✓ Supply Chain &amp; SRI Auditor</text>
  <line x1="48" y1="105" x2="250" y2="105" stroke="#06b6d4" stroke-width="2"/>
  <text x="280" y="90" fill="#94a3b8" font-size="13">SRI Hash Synthesizer</text>
  <text x="470" y="90" fill="#94a3b8" font-size="13">CDN Tamper &amp; Attack Simulator</text>
  <text x="730" y="90" fill="#94a3b8" font-size="13">Build Tool Integrations</text>
  <text x="930" y="90" fill="#94a3b8" font-size="13">HTML Template Editor</text>

  <!-- Score Panel -->
  <g transform="translate(32, 130)" filter="url(#shadow)">
    <rect width="280" height="490" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>
    
    <circle cx="140" cy="110" r="55" fill="none" stroke="#233047" stroke-width="8"/>
    <circle cx="140" cy="110" r="55" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="345" stroke-dashoffset="0"/>
    <text x="140" y="112" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle" font-family="monospace">100</text>
    <text x="140" y="132" fill="#64748b" font-size="11" text-anchor="middle">/ 100 PTS</text>

    <rect x="90" y="185" width="100" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="140" y="204" fill="#10b981" font-size="14" font-weight="800" text-anchor="middle">GRADE A+</text>
    <text x="140" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">Production Hardened</text>

    <!-- Metric Chips -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="27" y="26" fill="#f43f5e" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="27" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">CRIT</text>

      <rect x="62" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="89" y="26" fill="#f59e0b" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="89" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">HIGH</text>

      <rect x="124" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="151" y="26" fill="#eab308" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="151" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">MED</text>

      <rect x="186" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="213" y="26" fill="#06b6d4" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="213" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">LOW</text>
    </g>

    <line x1="20" y1="335" x2="260" y2="335" stroke="#233047"/>
    <text x="24" y="360" fill="#94a3b8" font-size="12">Script Coverage: <tspan fill="#10b981" font-weight="600">100% (2 / 2)</tspan></text>
    <text x="24" y="385" fill="#94a3b8" font-size="12">CORS Attributes: <tspan fill="#10b981" font-weight="600">anonymous Enforced</tspan></text>
    <text x="24" y="410" fill="#94a3b8" font-size="12">PCI DSS 4.0 (Req 6.4.3): <tspan fill="#10b981" font-weight="600">Compliant</tspan></text>
    <text x="24" y="435" fill="#94a3b8" font-size="12">Hijacked CDNs: <tspan fill="#10b981" font-weight="600">0 Detected (Clean)</tspan></text>
  </g>

  <!-- Right Passed Controls -->
  <g transform="translate(332, 130)" filter="url(#shadow)">
    <rect width="836" height="490" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>

    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700">Verified Security Controls (7/7)</text>
    <rect x="700" y="18" width="110" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="755" y="34" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">ALL PASSED</text>

    <!-- Controls List -->
    <g transform="translate(24, 60)">
      <rect width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="26" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="26" fill="#ffffff" font-size="13" font-weight="600">Clean Host Reputation:</text>
      <text x="220" y="26" fill="#94a3b8" font-size="13">No known hijacked or malicious CDN endpoints detected (e.g. polyfill.io).</text>

      <rect y="52" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="78" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="78" fill="#ffffff" font-size="13" font-weight="600">Full Script SRI Coverage:</text>
      <text x="240" y="78" fill="#94a3b8" font-size="13">All external JavaScript dependencies enforce cryptographic integrity hashes.</text>

      <rect y="104" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="130" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="130" fill="#ffffff" font-size="13" font-weight="600">CORS Handshake Attributes Present:</text>
      <text x="310" y="130" fill="#94a3b8" font-size="13">Cross-origin assets declare crossorigin="anonymous" for SRI verification.</text>

      <rect y="156" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="182" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="182" fill="#ffffff" font-size="13" font-weight="600">Strong Cryptographic Digest Functions:</text>
      <text x="330" y="182" fill="#94a3b8" font-size="13">Integrity hashes utilize robust SHA-384 or SHA-512 algorithms.</text>

      <rect y="208" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="234" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="234" fill="#ffffff" font-size="13" font-weight="600">Pinned Semantic Versioning:</text>
      <text x="260" y="234" fill="#94a3b8" font-size="13">CDN asset URLs pin specific release versions, preventing unexpected hash drift.</text>

      <rect y="260" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="286" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="286" fill="#ffffff" font-size="13" font-weight="600">Encrypted Asset Delivery (HTTPS):</text>
      <text x="300" y="286" fill="#94a3b8" font-size="13">All remote assets are fetched via secure HTTPS channels.</text>

      <rect y="312" width="788" height="42" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="338" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="338" fill="#ffffff" font-size="13" font-weight="600">PCI DSS 4.0 Requirement 6.4.3 Readiness:</text>
      <text x="350" y="338" fill="#94a3b8" font-size="13">All payment page scripts are inventoried and cryptographically verified.</text>
    </g>
  </g>
</svg>
